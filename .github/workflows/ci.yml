name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
        
      - name: Install dependencies
        run: npm ci
        
      - name: Run TypeScript build
        run: npm run build
        
      - name: Run Tests
        run: npm test
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
