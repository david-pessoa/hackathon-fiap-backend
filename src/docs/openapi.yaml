          in: query
          schema:
            $ref: '#/components/schemas/OccurrenceRequestType'
      responses:
        '200':
          description: Pedidos retornados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOccurrenceRequests'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

  /occurrences/{id}/requests/latest:
    get:
      tags: [Pedidos de encerramento de ocorrência]
      summary: Consultar o pedido mais recente da ocorrência
      description: Gestor e funcionário atribuído à ocorrência podem consultar o pedido mais recente, independentemente de seu status. Retorna null se ainda não houver pedido.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido mais recente ou null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceRequest'
                    
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

  /occurrence-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        description: UUID do pedido.
        schema:
          type: string
          format: uuid
    get:
      tags: [Pedidos de encerramento de ocorrência]
      summary: Obter pedido pelo ID
      description: Gestor e funcionário atribuído à ocorrência podem consultar os detalhes do pedido.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pedidos de encerramento de ocorrência]
      summary: Remover pedido
      description: Exclusão permitida somente ao funcionário autor do pedido e enquanto o pedido estiver PENDING. Recomenda-se registrar a remoção para auditoria, caso necessário.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pedido removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Pedido removido com sucesso.
        '400':
          description: Pedido já analisado e não pode ser removido.
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

  /occurrence-requests/{requestId}/image:
    get:
      tags: [Pedidos de encerramento de ocorrência, Imagens]
      summary: Obter imagem da solicitação do pedido de conclusão/cancelamento da ocorrência
      parameters:
        - name: requestId
          in: path
          required: true
          description: UUID do pedido.
          schema:
            type: string
            format: uuid

      security:
        - sessionCookie: []
      responses:
        '200':
          description: Arquivo da imagem.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'

  /occurrence/status-history/{statusHistoryId}/image:
    get:
      tags: [Histórico de status, Imagens]
      summary: Obter imagem da solicitação do pedido de conclusão/cancelamento da ocorrência
      parameters:
        - name: statusHistoryId
          in: path
          required: true
          description: UUID do pedido.
          schema:
            type: string
            format: uuid

      security:
        - sessionCookie: []
      responses:
        '200':
          description: Arquivo da imagem.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard/manager:
    get:
      tags: [Dashboard]
      summary: '[⚠️ Em Revisão] Obter indicadores do dashboard do gestor'
      description: Retorna total, distribuição por status, prioridade e categoria, avaliações, tempo médio de resolução e prévia de ocorrências filtrável por categoria.
      security:
        - sessionCookie: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Indicadores do gestor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /dashboard/employee:
    get:
      tags: [Dashboard]
      summary: '[⚠️ Em Revisão] Obter dashboard do funcionário autenticado'
      description: Retorna ocorrências atribuídas pendentes/em atendimento, total atribuído, concluídas no mês e prévia ordenada por prioridade.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Indicadores do funcionário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador UUID do recurso.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Página solicitada.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Quantidade máxima de registros por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  schemas:
    UserRole:
      type: string
      enum: [REQUESTER, EMPLOYEE, MANAGER]
    OccurrenceStatus:
      type: string
      enum: [OPEN, UNDER_ANALYSIS, IN_PROGRESS, COMPLETED, CANCELLED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        cpf:
          type: string
          description: CPF do usuário; nunca retornar senha ou hash da senha.
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        image:
          type: string
          nullable: true
          description: URL do endpoint da imagem de perfil.
        categories:
          type: array
          description: Categorias associadas ao funcionário; ausente para outros perfis.
          items:
            $ref: '#/components/schemas/Category'
      required: [id, name, role, cpf, email, phone, address]

    UserInput:
      type: object
      required: [name, role, cpf, email, phone, address, password]
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        cpf:
          type: string
          example: '12345678901'
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        password:
          type: string
          format: password
        image:
          type: string
          format: binary
    UserUpdateInput:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        cpf:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        password:
          type: string
          format: password
        image:
          type: string
          format: binary

    Category:
      type: object
      properties: 
        id:
          type: string
          format: uuid
        name:
          type: string
      
    Occurrence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requester:
          $ref: '#/components/schemas/UserSummary'
        employee:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/OccurrenceStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        location:
          type: string
        image:
          type: string
          nullable: true
          description: URL do endpoint da imagem da ocorrência.
        createdAt:
          type: string
          format: date-time
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Avaliação do solicitante após a conclusão.
      required: [id, requester, category, title, description, status, priority, location, createdAt]
    
    OccurrenceEmployeeDashboard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requester:
          $ref: '#/components/schemas/UserSummary'
        employee:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        categories:
          $ref: '#/components/schemas/Category'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/OccurrenceStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        location:
          type: string
        image:
          type: string
          nullable: true
          description: URL do endpoint da imagem da ocorrência.
        createdAt:
          type: string
          format: date-time
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          example: null
          description: Avaliação do solicitante após a conclusão.
      required: [id, requester, category, title, description, status, priority, location, createdAt]

    OccurrenceUpdateInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/Priority'
        location:
          type: string
        image:
          type: string
          format: binary

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required: [id, name]

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurrenceId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserSummary'
        content:
          type: string
        image:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, occurrenceId, user, content, createdAt]

    StatusHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurrenceId:
          type: string
          format: uuid
        previousStatus:
          allOf:
            - $ref: '#/components/schemas/OccurrenceStatus'
          nullable: true
        newStatus:
          $ref: '#/components/schemas/OccurrenceStatus'
        changedAt:
          type: string
          format: date-time
        changedBy:
          $ref: '#/components/schemas/UserSummary'
        employee:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        observation:
          type: string
          nullable: true
      required: [id, occurrenceId, newStatus, changedAt, changedBy]


    OccurrenceRequestType:
      type: string
      enum: [COMPLETION, CANCELLATION]
    OccurrenceRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    OccurrenceRequestInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          example: Serviço realizado e problema resolvido.
        image:
          type: string
          format: binary
          description: Evidência opcional, quando aplicável.
    OccurrenceRequestDecisionInput:
      type: object
      required: [status, observation]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
        observation:
          type: string
          description: Observação opcional do gestor sobre a decisão.
    OccurrenceRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurrenceId:
          type: string
          format: uuid
        requestedBy:
          $ref: '#/components/schemas/UserSummary'
        reason:
          type: string
        type:
          $ref: '#/components/schemas/OccurrenceRequestType'
        status:
          $ref: '#/components/schemas/OccurrenceRequestStatus'
        createdAt:
          type: string
          format: date-time
        image:
          type: string
          nullable: true
          description: URL ou caminho da imagem anexada, quando houver.
        reviewedBy:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        observation:
          type: string
          nullable: true
      required: [id, occurrenceId, requestedBy, reason, type, status, createdAt]
    PaginatedOccurrenceRequests:
      type: array
      items:
        $ref: '#/components/schemas/OccurrenceRequest'

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
        totalPages:
          type: integer
        pageLength:
          type: integer
        totalItems:
          type: integer
          minimum: 0
      required: [currentPage, totalPages, pageLength, totalItems]

    PaginatedUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [users, pagination]

    PaginatedOccurrences:
      type: object
      properties:
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/Occurrence'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [occurrences, pagination]

    ManagerDashboard:
      type: object
      properties:
        totalOccurrences:
          type: integer
        byStatus:
          type: object
          properties:
            open:
              type: integer
            underAnalysis:
              type: integer
            inProgress:
              type: integer
            completed:
              type: integer
            cancelled:
              type: integer
        byPriority:
          type: object
          properties:
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
        
        byCategory:
          $ref: '#/components/schemas/Category'
        total:
          type: integer
        averageResolutionDays:
          type: number
          format: float
          nullable: true
        ratings:
          type: object
          properties:
            average:
              type: number
              format: float
              nullable: true
            total:
              type: integer
            distribution:
              type: object
              additionalProperties:
                type: integer
        preview:
          type: array
          items:
            $ref: '#/components/schemas/Occurrence'

    EmployeeDashboard:
      type: object
      properties:
        pendingAssigned:
          type: integer
        totalAssigned:
          type: integer
        completedThisMonth:
          type: integer
        preview:
          type: array
          description: Ocorrências atribuídas ao funcionário, ordenadas por prioridade.
          items:
            type: object
            properties:
              manager:
                type: object
                properties: 
                  id: 
                    type: string
                    example: b1fcca4d-360d-445d-a387-60fce9a3a182
                  name: 
                    type: string
                    example: Francisco Ferraz
              occurrence:
                $ref: '#/components/schemas/OccurrenceEmployeeDashboard'

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

  responses:
    UnauthorizedError:
      description: Falha na autenticação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingCookie:
              summary: Cookie ausente
              value:
                message: Sessão não informada.
            invalidCookie:
              summary: Cookie inválido ou expirado
              value:
                message: Sessão inválida ou expirada.
    ForbiddenError:
      description: O usuário autenticado não possui permissão para acessar este recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Acesso não autorizado.
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Recurso não encontrado.
    BadRequest:
      description: Dados inválidos na requisição.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Dados inválidos.
