openapi: 3.0.3
info:
  title: API Resolve Aí
  description: API para gerenciamento de ocorrências, usuários, comentários e categorias.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Servidor local
  - url: https://resolve-ai.example.com/api
    description: Servidor de produção (substituir pela URL definitiva)

tags:
  - name: Autenticação
  - name: Usuários
  - name: Ocorrências
  - name: Comentários
  - name: Categorias
  - name: Histórico de status
  - name: Dashboard
  - name: Imagens
  - name: Pedidos de encerramento de ocorrência

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Realizar login
      description: Autentica o usuário por CPF e senha. A sessão é enviada em cookie HttpOnly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, password]
              properties:
                cpf:
                  type: string
                  description: CPF com ou sem pontuação.
                  example: '12345678901'
                password:
                  type: string
                  format: password
                  example: senha123
      responses:
        '200':
          description: Login realizado. O servidor define o cookie de sessão com HttpOnly.
          headers:
            Set-Cookie:
              description: Cookie de sessão; deve incluir HttpOnly, Secure em produção, SameSite apropriado e Path=/.
              schema:
                type: string
                example: session=eyJhbGciOi...; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
              example:
                message: Login realizado com sucesso!
                user:
                  id: 2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201
                  name: Maria Silva
                  role: REQUESTER
                  cpf: '12345678901'
                  email: maria@email.com
                  phone: '11987654321'
                  address: Rua das Flores, 100 - São Paulo/SP
                  image: /api/users/2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201/image
        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          description: CPF ou senha inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: CPF ou senha inválidos.
    options:
      summary: Preflight CORS
      responses:
        '204':
          description: Preflight aceito.

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerrar sessão
      description: Invalida a sessão e expira o cookie HttpOnly.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Logout realizado.
          headers:
            Set-Cookie:
              description: Cookie de sessão expirado.
              schema:
                type: string
                example: session=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logout realizado com sucesso.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  
  /auth/forgot-password:
    post:
      tags: [Autenticação]
      summary: Solicitar código para redefinição de senha
      description: Envia um código de 6 dígitos para o email informado, caso associado a uma conta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@email.com
      responses:
        '200':
          description: Código enviado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Foi enviado um código para o email usuario@email.com
        '400':
          description: Erro no envio do código.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Houve um erro no envio do código
  
    put:
      tags: [Autenticação]
      summary: Validar código de redefinição de senha
      description: Valida o código de 6 dígitos enviado ao email do usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@email.com
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
      responses:
        '200':
          description: Código validado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Código validado com sucesso
        '400':
          description: Código incorreto ou expirado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                      - Código incorreto
                      - Código expirado

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Obter dados do usuário autenticado
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Dados do usuário autenticado, sem senha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example: 
                id: 2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201
                name: Maria Silva
                role: REQUESTER
                cpf: '12345678901'
                email: maria@email.com
                phone: '11987654321'
                address: Rua das Flores, 100 - São Paulo/SP
                image: /api/users/2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201/image
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users:
    get:
      tags: [Usuários]
      summary: Listar usuários
      description: Lista usuários de acordo com as permissões do perfil autenticado. A listagem é paginada.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: categoryId
          in: query
          description: Filtra funcionários vinculados à categoria informada.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Usuários retornados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
              example:
                users: 
                  - id: 2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201
                    name: Maria Silva
                    role: REQUESTER
                    cpf: '12345678901'
                    email: maria@email.com
                    phone: '11987654321'
                    address: Rua das Flores, 100 - São Paulo/SP
                    image: /api/users/2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201/image
                    categories: null
                  - id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                    name: Rafael Gomes
                    role: EMPLOYEE
                    cpf: '123456728184'
                    email: rafael@email.com
                    phone: '11987654321'
                    address: Rua das Flores, 102 - São Paulo/SP
                    image: /api/users/e5d67d85-3e41-41bb-ba9b-ba07b3cd0346/image
                    categories: 
                      - Limpeza
                      - Iluminação
                      - Vazamentos
                  - id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                    name: Murilo Silveira
                    role: MANAGER
                    cpf: '12345678901'
                    email: murilo.silveira@email.com
                    phone: '11987654321'
                    address: Rua das Flores, 100 - São Paulo/SP
                    image: /api/users/e5d67d85-3e41-41bb-ba9b-ba07b3cd0346/image
                    categories: null
                pagination:
                    currentPage: 1
                    totalPages: 1
                    pageLength: 3
                    totalItems: 3
                
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [Usuários]
      summary: Criar usuário
      description: Cadastro de solicitante. A criação de funcionários e gestores deve ser restrita ao gestor.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Usuário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                message: Usuário criado com sucesso!
                user:
                  id: 2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201
                  name: Maria Silva
                  role: REQUESTER
                  cpf: '12345678901'
                  email: maria@email.com
                  phone: '11987654321'
                  address: Rua das Flores, 100 - São Paulo/SP
                  image: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: CPF ou e-mail já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: O email ou CPF utilizado já está cadastrado

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuários]
      summary: Obter usuário pelo ID
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201
                name: Maria Silva
                role: REQUESTER
                cpf: '12345678901'
                email: maria@email.com
                phone: '11987654321'
                address: Rua das Flores, 100 - São Paulo/SP
                image: /api/users/2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201/image
                categories: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Usuários]
      summary: Atualizar usuário
      description: Atualiza os dados do usuário identificado na URL. A senha, quando alterada, deve ser armazenada com hash no servidor.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201
                name: Maria Silva
                role: REQUESTER
                cpf: '12345678901'
                email: maria@email.com
                phone: '11987654321'
                address: Rua das Flores, 100 - São Paulo/SP
                image: /api/users/2a8c2b4e-61f7-4f8b-9c1a-6f0b8c5a1201/image
                categories: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CPF ou e-mail já utilizado por outro usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: CPF ou email já cadastrados
    delete:
      tags: [Usuários]
      summary: Excluir usuário
      description: Exclusão restrita ao gestor. Recomenda-se impedir a exclusão de usuários referenciados por ocorrências ou aplicar exclusão lógica.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Usuário excluído.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Usuário deletado com sucesso!
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Usuário possui vínculos que impedem a exclusão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Usuário deletado com sucesso!

  /users/{id}/image:
    get:
      tags: [Usuários, Imagens]
      summary: Obter imagem de perfil
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Arquivo da imagem.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'

  /occurrences:
    get:
      tags: [Ocorrências]
      summary: Listar ocorrências
      description: Solicitantes recebem somente as próprias ocorrências; gestores podem visualizar todas; funcionários recebem as atribuídas a eles. Todas as listagens são paginadas.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OccurrenceStatus'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
      responses:
        '200':
          description: Ocorrências retornadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOccurrences'
              example:
                occurrences:
                  - id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                    requester:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Maria Luísa
                    employee: null
                    category:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Limpeza
                    title: Goteira no teto da Churrasqueira
                    description: Durante a chuva forte de ontem, a churrasqueira começou a apresentar goteiras em vários pontos do telhado
                    status: OPEN
                    priority: MEDIUM
                    location: Churrasqueira, Térreo
                    image: /path/to/image
                    createdAt: "2026-11-23T00:14:34.304Z"
                    rating: null
                  - id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                    requester:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Fernando Siqueira
                    employee: null
                    category:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Segurança
                    title: Assalto no Condomínio
                    description: Hoje de manhã o condomínio foi assaltado, os ladrões pularam o muro. Acredito que precisamos construir uma cerca elétrica sobre ele
                    status: UNDER_ANALYSIS
                    priority: HIGH
                    location: Portão na entrada do condomínio, Térreo
                    image: /path/to/image
                    createdAt: "2026-11-23T00:14:34.304Z"
                    rating: null
                  - id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                    requester:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Maria Luísa
                    employee: null
                    category:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Manutenção e Obras
                    title: Reforma no piso do prédio
                    description: O piso da entrada do condomínio está quebrado, com várias rachaduras. É necessária uma reforma!
                    status: IN_PROGRESS
                    priority: MEDIUM
                    location: Entrada do condomínio, Térreo
                    image: /path/to/image
                    createdAt: "2026-11-23T00:14:34.304Z"
                    rating: null
                  - id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                    requester:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Marcos Ferreira
                    employee: null
                    category:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Manutenção e Obras
                    title: Pintura da parede dos Halls do elevador
                    description: A pintura das paredes do Halls dos elevadores está antiga, precisamos atualizar o design delas!
                    status: CANCELLED
                    priority: LOW
                    location: Hall do elevador social, 5º andar, bloco A
                    image: /path/to/image
                    createdAt: "2026-11-23T00:14:34.304Z"
                    rating: 3
                  - id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                    requester:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Gabriela Nunes
                    employee: 
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: João Pedro da Silva
                    category:
                      id: e5d67d85-3e41-41bb-ba9b-ba07b3cd0346
                      name: Manutenção e Obras
                    title: Não há corrimãos nos degraus do playground
                    description: Os degraus da pequena escada que dá acesso ao Playground no Térreo do condomínio não possuem corrimãos ou outro tipo de apoio, impedindo que minha avó consiga subí-los.
                    status: COMPLETED
                    priority: MEDIUM
                    location: Playground do condomínio, Térreo
                    image: /path/to/image
                    createdAt: "2026-11-23T00:14:34.304Z"
                    rating: 5
                pagination:  
                  currentPage: 1
                  totalPages: 1
                  pageLength: 5
                  totalItems: 5
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [Ocorrências]
      summary: Criar ocorrência
      description: Solicitante autenticado registra uma ocorrência. O solicitante é identificado pela sessão, não pelo corpo da requisição. Pode ser enviado um comentário inicial.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, categoryId, location, priority, image]
              properties:
                title:
                  type: string
                  example: Lâmpada queimada no corredor
                description:
                  type: string
                  example: A iluminação do corredor do segundo andar não está funcionando.
                categoryId:
                  type: string
                  format: uuid
                  example: c1a64918-5eb5-472a-9145-372544148d57
                location:
                  type: string
                  example: Bloco B, segundo andar
                priority:
                  $ref: '#/components/schemas/Priority'
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Ocorrência criada com status inicial OPEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
              example:
                message: Ocorrência registrada com sucesso!
                occurrence:
                  id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                  requester:
                    id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                    name: Maria da Silva
                  employee: null
                  category:
                    id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                    name: Limpeza
                  title: Playground precisa de revitalização
                  description: Os brinquedos das crianças no playground estão velhos e quebrados, o que representa um risco. Além disso, o local está sujo e precisando de uma limpeza.
                  status: OPEN
                  priority: LOW
                  location: Playground, Térreo
                  image: /path/to/image
                  createdAt: "2026-11-23T00:51:17.518Z"
                  rating: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /occurrences/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Ocorrências]
      summary: Obter ocorrência pelo ID
      description: Solicitante só pode consultar a própria ocorrência; funcionário, ocorrências atribuídas a ele; gestor, qualquer ocorrência. Quando algum usuário visualiza uam ocorrência, o sistema registra a visualização
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Ocorrência encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
              example:
                id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                requester:
                  id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                  name: Maria da Silva
                employee: null
                category:
                  id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                  name: Limpeza
                title: Playground precisa de revitalização
                description: Os brinquedos das crianças no playgroundestão velhos e quebrados, o que representa um risco.Além disso, o local está sujo e precisando de umalimpeza.
                status: OPEN
                priority: LOW
                location: Playground, Térreo
                image: /path/to/image
                createdAt: "2026-11-23T00:51:17.518Z"
                rating: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ocorrências]
      summary: Atualizar ocorrência
      description: Atualização dos dados cadastrais. O solicitante só pode editar os dados permitidos da própria ocorrência; alterações administrativas devem ser feitas pelo gestor. Não permite alterar status por esta rota.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OccurrenceUpdateInput'
      responses:
        '200':
          description: Ocorrência atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
              example:
                id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                requester:
                  id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                  name: Maria da Silva
                employee: 
                  id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                  name: Lucas Gomes
                category:
                  id: 1ad01e32-f158-416c-9cfe-fa2eb0e7dc17
                  name: Limpeza
                title: Playground precisa de revitalização
                description: Os brinquedos das crianças no playgroundestão velhos e quebrados, o que representa um risco.Além disso, o local está sujo e precisando de umalimpeza.
                status: COMPLETED
